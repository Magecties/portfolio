<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="MB">
  <!-- Letters are drawn as paths, not <text>: Montserrat is not installed on a
       visitor's machine, so a text-based favicon would fall back to Times.
       No dark-mode inversion on purpose — the white letters carry the contrast,
       so the ink square still reads on dark tab strips without going glaring. -->
  <rect fill="#131313" width="100" height="100" rx="20" />
  <!-- skewX matches the italic of the .brand type; the translate re-centres it -->
  <g transform="translate(8.82,0) skewX(-10)">
    <path
      fill="#FCFCFA"
      d="M14,76 L14,24 L26,24 L32,44 L38,24 L50,24 L50,76 L39.5,76 L39.5,47 L34.5,62 L29.5,62 L24.5,47 L24.5,76 Z"
    />
    <path
      fill="#FCFCFA"
      fill-rule="evenodd"
      d="M54,24 L71,24 A12,13 0 0 1 71,50 L72,50 A14,13 0 0 1 72,76 L54,76 Z
         M65,32.5 L70,32.5 A5,4.75 0 0 1 70,42 L65,42 Z
         M65,58 L70,58 A6,5 0 0 1 70,68 L65,68 Z"
    />
  </g>
</svg>
